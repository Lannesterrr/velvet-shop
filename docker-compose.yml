# Локальная база данных для разработки.
# Запуск:  docker compose up -d      Остановка:  docker compose down
# Данные хранятся в именованном томе и переживают перезапуск.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tg-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
