# /etc/nginx/sites-available/tg-shop
# Замените shop.example.com на свой домен.
# HTTPS-сертификат выпускается командой:  sudo certbot --nginx -d shop.example.com
# (certbot сам допишет блок listen 443 и редирект с http на https)

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # Чеки и фото до 10 МБ (+ запас на multipart)
    client_max_body_size 12m;

    # Сжатие ответов
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Всё проксируем в Node.js: API, webhook бота, фото и собранный фронтенд
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
